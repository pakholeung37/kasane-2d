[package]
name = "kasane-psd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Import layered PSD artwork into a Kasane document draft"

[dependencies]
ag-psd = "=0.3.0"
kasane-core = { path = "../kasane-core" }
png.workspace = true
sha2.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Enable ARM SHA instructions on Apple Silicon; sha2-asm does not support Windows.
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
kasane-moc3-psd = { path = "../kasane-moc3-psd" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
kasane-render = { path = "../kasane-render" }
kasane-render-metal = { path = "../kasane-render-metal" }
