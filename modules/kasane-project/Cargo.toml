[package]
name = "kasane-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Project persistence, document codec, resource management and publication for Kasane 2D"

[features]
binary-prototype = ["dep:ciborium"]

[dependencies]
kasane-core = { path = "../kasane-core" }
kasane-live2d = { path = "../kasane-live2d" }
kasane-moc3 = { path = "../kasane-moc3" }
kasane-psd = { path = "../kasane-psd" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
png = { workspace = true }
ciborium = { version = "0.2.2", optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Enable ARM SHA instructions on Apple Silicon; sha2-asm does not support Windows.
sha2 = { workspace = true, features = ["asm"] }

[[example]]
name = "project_binary_prototype"
required-features = ["binary-prototype"]

[[bench]]
name = "codec_benchmark"
harness = false
