[package]
name = "kasane-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Python bindings for the Kasane 2D authoring SDK"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
kasane-core = { path = "../kasane-core" }
kasane-sdk = { path = "../kasane-sdk" }
kasane-render = { path = "../kasane-render" }
kasane-moc3 = { path = "../kasane-moc3" }
pyo3 = { version = "=0.29.2", features = ["multiple-pymethods"] }
serde_json = { workspace = true }
serde = { workspace = true }
kasane-sdk-observe = { path = "../kasane-sdk-observe", optional = true, default-features = false }

[features]
default = ["framework-texture-filtering"]
framework-texture-filtering = ["kasane-sdk-observe?/framework-texture-filtering"]
observe = ["dep:kasane-sdk-observe"]
