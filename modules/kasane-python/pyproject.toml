[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "kasane"
dynamic = ["version"]
requires-python = ">=3.14,<3.15"
description = "Scriptable 2D model authoring SDK"
readme = "README.md"

[project.urls]
Repository = "https://github.com/pakholeung37/kasane-2d"
Documentation = "https://github.com/pakholeung37/kasane-2d/blob/main/modules/kasane-python/API.md"

[tool.maturin]
python-source = "python"
module-name = "kasane._native"
bindings = "pyo3"
