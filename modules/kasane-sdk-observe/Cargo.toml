[package]
name = "kasane-sdk-observe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Immutable observation inputs and GPU capture for Kasane SDK"

[features]
default = ["framework-texture-filtering"]
framework-texture-filtering = []

[dependencies]
kasane-animation = { path = "../kasane-animation" }
kasane-core = { path = "../kasane-core" }
kasane-sdk = { path = "../kasane-sdk" }
kasane-project = { path = "../kasane-project" }
kasane-render = { path = "../kasane-render" }
png = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Enable ARM SHA instructions on Apple Silicon; sha2-asm does not support Windows.
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
kasane-render-metal = { path = "../kasane-render-metal" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
kasane-render-wgpu = { path = "../kasane-render-wgpu" }
wgpu = { workspace = true }
