[package]
name = "cubism-matrix-kasane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kasane-core = { path = "../../../../modules/kasane-core" }
kasane-render = { path = "../../../../modules/kasane-render" }
kasane-render-metal = { path = "../../../../modules/kasane-render-metal" }
kasane-sdk = { path = "../../../../modules/kasane-sdk" }
kasane-sdk-observe = { path = "../../../../modules/kasane-sdk-observe" }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# Enable ARM SHA instructions on Apple Silicon; sha2-asm does not support Windows.
sha2 = { workspace = true, features = ["asm"] }
