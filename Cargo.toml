[workspace]
resolver = "2"
members = [
    "modules/kasane-core",
    "modules/kasane-render",
    "modules/kasane-render-wgpu",
    "modules/kasane-moc3",
    "modules/kasane-moc3-psd",
    "modules/kasane-psd",
    "modules/kasane-project",
    "modules/kasane-sdk",
    "modules/kasane-sdk-observe",
    "modules/kasane-python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
authors = ["Kasane 2D Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
sha2 = "0.10"
png = "0.17"
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "29"

# Some macOS 27 toolchains produce an unloadable cdylib when release stripping
# uses an external llvm-objcopy without the Mach-O LINKEDIT alignment fix.
[profile.release.package.kasane-python]
strip = "none"
