[workspace]
resolver = "2"
members = [
    "modules/kasane-core",
    "modules/kasane-render",
    "modules/kasane-render-godot",
    "modules/kasane-render-wgpu",
    "modules/kasane-preview",
    "modules/kasane-godot",
    "modules/kasane-moc3",
    "modules/kasane-project",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
authors = ["Kasane 2D Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
png = "0.17"
bytemuck = { version = "1.25", features = ["derive"] }
wgpu = "29"
