name: Native core
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libpng-dev libssl-dev pkg-config python3-venv
      - name: Install pinned format and tidy tools
        run: |
          python3 -m venv target/quality-venv
          target/quality-venv/bin/pip install --disable-pip-version-check clang-format==22.1.8 clang-tidy==22.1.8 SCons==4.11.1
      - name: Configure compilation databases
        run: |
          cmake --preset core-debug
          target/quality-venv/bin/python -m SCons -C modules/gd-kasane platform=linux arch=x86_64 target=template_debug compiledb
      - name: Build Godot adapter with strict warnings
        run: target/quality-venv/bin/python -m SCons -C modules/gd-kasane platform=linux arch=x86_64 target=template_debug -j4
      - name: Format and static analysis
        run: |
          python3 tools/check_cpp_quality.py \
            --clang-format target/quality-venv/bin/clang-format \
            --clang-tidy target/quality-venv/bin/clang-tidy \
            --compile-commands target/cmake/core-debug

  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug
            preset: core-debug
            cc: gcc
            cxx: g++
          - name: clang-asan-ubsan
            preset: core-asan
            cc: clang
            cxx: clang++
    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libpng-dev libssl-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 2

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install libFuzzer toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev cmake ninja-build libpng-dev libssl-dev
      - name: Generate a valid MOC3 seed
        run: |
          cmake --preset core-debug
          cmake --build --preset core-debug --parallel 4
          target/cmake/core-debug/modules/kasane-core/kasane_moc3_purism_tests target/fuzz/fixtures
          mkdir -p target/fuzz/corpus-arena target/fuzz/corpus-malloc
          cp target/fuzz/fixtures/model.moc3 target/fuzz/corpus-arena/valid.moc3
          cp target/fuzz/fixtures/model.moc3 target/fuzz/corpus-malloc/valid.moc3
      - name: Build and run both allocator modes
        env:
          FUZZ_CC: clang-18
        run: |
          sh tools/run_purism_fuzz.sh arena 200
          sh tools/run_purism_fuzz.sh malloc 200
