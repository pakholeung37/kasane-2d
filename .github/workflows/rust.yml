name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Static analysis
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Acceptance validator negative controls
        run: python -m unittest discover -s tests -p test_acceptance_validators.py -v
      - name: Decoder safety without native Core
        env:
          KASANE_MOC3_DISABLE_CORE_VALIDATION: "1"
        run: cargo test -p kasane-moc3 --no-default-features --test safety_tests --locked
      - name: Regression tests
        run: cargo test --workspace --locked
      - name: Build Python wheel
        env:
          RUSTFLAGS: -C strip=none
        run: python -m pip wheel --no-deps --wheel-dir target/wheels modules/kasane-python
      - name: SDK wheel integration
        run: python -c "from pathlib import Path; import subprocess, sys; wheels = list(Path('target/wheels').glob('kasane-*.whl')); assert len(wheels) == 1, wheels; sys.exit(subprocess.call([sys.executable, 'tools/validate_sdk.py', '--wheel', str(wheels[0])]))"
      - name: SDK Python typing
        run: python -c "from pathlib import Path; import subprocess, sys; wheels = list(Path('target/wheels').glob('kasane-*.whl')); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'pyright==1.1.414', str(wheels[0])]); subprocess.check_call([sys.executable, '-m', 'pyright', '--pythonpath', sys.executable, 'examples/sdk/python_cpu_recipe.py'])"
      - name: WGPU blend reference
        if: runner.os == 'macOS'
        run: python tools/compare_wgpu_blends.py
